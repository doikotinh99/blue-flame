<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%">
  <defs>
    <linearGradient id="rtuG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rtuBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <ellipse cx="160" cy="255" rx="125" ry="14" fill="#000" opacity="0.45"/>
  <!-- RTU Curb Base -->
  <rect x="40" y="215" width="240" height="25" rx="4" fill="#334155" stroke="#475569" stroke-width="2"/>
  <!-- RTU Main Cabinet -->
  <rect x="45" y="70" width="230" height="150" rx="8" fill="url(#rtuG)" stroke="#334155" stroke-width="2.5"/>
  <rect x="50" y="75" width="220" height="140" rx="6" fill="none" stroke="url(#rtuBlue)" stroke-width="1.2" opacity="0.5"/>
  <!-- Access Panels -->
  <line x1="120" y1="75" x2="120" y2="215" stroke="#334155" stroke-width="2"/>
  <line x1="195" y1="75" x2="195" y2="215" stroke="#334155" stroke-width="2"/>
  <!-- Condenser Fan Top Hood -->
  <ellipse cx="85" cy="70" rx="30" ry="10" fill="#0b1329" stroke="#38bdf8" stroke-width="1.8"/>
  <ellipse cx="155" cy="70" rx="30" ry="10" fill="#0b1329" stroke="#38bdf8" stroke-width="1.8"/>
  <!-- Economizer & Intake Hood -->
  <path d="M195 90 L260 90 L260 150 L195 150 Z" fill="#0b1329" stroke="#334155" stroke-width="1.5"/>
  <g stroke="#38bdf8" stroke-width="1.5">
    <line x1="205" y1="105" x2="250" y2="105"/>
    <line x1="205" y1="120" x2="250" y2="120"/>
    <line x1="205" y1="135" x2="250" y2="135"/>
  </g>
  <!-- Spec Badge -->
  <rect x="55" y="165" width="130" height="35" rx="5" fill="#081126" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="120" y="180" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#00d4ff" text-anchor="middle">COMMERCIAL RTU</text>
  <text x="120" y="193" font-family="system-ui, sans-serif" font-size="7.5" font-weight="bold" fill="#ff6550" text-anchor="middle">ROOFTOP 3 - 25 TONS</text>
