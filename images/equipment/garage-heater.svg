<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%">
  <defs>
    <linearGradient id="ghG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ghFlame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6550"/><stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <ellipse cx="160" cy="255" rx="110" ry="12" fill="#000" opacity="0.45"/>
  <!-- Unit Heater Body suspended -->
  <rect x="55" y="65" width="210" height="175" rx="10" fill="url(#ghG)" stroke="#334155" stroke-width="2.5"/>
  <rect x="60" y="70" width="200" height="165" rx="8" fill="none" stroke="url(#ghFlame)" stroke-width="1.2" opacity="0.6"/>
  <!-- Mounting Bracket -->
  <path d="M75 35 L75 65 M245 35 L245 65" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <!-- Front Directional Louvers -->
  <g stroke="#334155" stroke-width="2.5">
    <line x1="75" y1="95" x2="245" y2="95"/>
    <line x1="75" y1="115" x2="245" y2="115"/>
    <line x1="75" y1="135" x2="245" y2="135"/>
    <line x1="75" y1="155" x2="245" y2="155"/>
    <line x1="75" y1="175" x2="245" y2="175"/>
  </g>
  <!-- Flame Burner Glow inside -->
  <ellipse cx="160" cy="135" rx="40" ry="18" fill="#ff6550" opacity="0.25"/>
  <circle cx="160" cy="135" r="8" fill="#f59e0b"/>
  <!-- Gas Unit Badge -->
  <rect x="85" y="195" width="150" height="30" rx="5" fill="#081126" stroke="#ff6550" stroke-width="1.5"/>
  <text x="160" y="210" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#f59e0b" text-anchor="middle">GARAGE UNIT HEATER</text>
  <text x="160" y="221" font-family="system-ui, sans-serif" font-size="7.5" font-weight="bold" fill="#38bdf8" text-anchor="middle">GAS / ELECTRIC INFRARED</text>
</svg>
