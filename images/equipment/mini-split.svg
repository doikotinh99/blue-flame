<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%">
  <defs>
    <linearGradient id="msG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="msBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/><stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <ellipse cx="160" cy="250" rx="120" ry="12" fill="#000" opacity="0.45"/>
  <!-- Wall Mount Indoor Unit -->
  <rect x="35" y="60" width="250" height="90" rx="12" fill="url(#msG)" stroke="#334155" stroke-width="2.5"/>
  <rect x="40" y="65" width="240" height="80" rx="8" fill="none" stroke="url(#msBlue)" stroke-width="1.2" opacity="0.6"/>
  <!-- Air Louver Vane -->
  <rect x="50" y="125" width="220" height="15" rx="4" fill="#0b1329" stroke="#334155" stroke-width="1.5"/>
  <line x1="60" y1="132" x2="260" y2="132" stroke="#00d4ff" stroke-width="2"/>
  <!-- Digital Display Panel -->
  <rect x="220" y="80" width="45" height="24" rx="4" fill="#081126" stroke="#00d4ff" stroke-width="1.5"/>
  <text x="242" y="97" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#00d4ff" text-anchor="middle">72°</text>
  <!-- Intake Air Grille -->
  <g stroke="#334155" stroke-width="1.8">
    <line x1="55" y1="75" x2="195" y2="75"/><line x1="55" y1="85" x2="195" y2="85"/><line x1="55" y1="95" x2="195" y2="95"/>
  </g>
  <!-- Mini-Split Inverter Outdoor Unit below -->
  <rect x="80" y="170" width="160" height="85" rx="8" fill="url(#msG)" stroke="#334155" stroke-width="2"/>
  <ellipse cx="160" cy="212" rx="36" ry="36" fill="#0b1329" stroke="#00d4ff" stroke-width="1.8"/>
  <circle cx="160" cy="212" r="8" fill="#ff6550"/>
  <!-- Badge -->
  <rect x="88" y="178" width="65" height="20" rx="3" fill="#081126" stroke="#00d4ff" stroke-width="1"/>
  <text x="120" y="192" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#00d4ff" text-anchor="middle">HEAT PUMP</text>
</svg>
